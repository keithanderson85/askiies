services:
  askiies:
    build: .
    container_name: askiies
    ports:
      - "5210:80"
    restart: unless-stopped

  # Multiplayer rooms + accounts + cloud saves. Not published on a host port:
  # players reach it through the askiies nginx at /mp/.
  askiies-mp:
    build: ./mp-server
    container_name: askiies-mp
    environment:
      # Password for the admin page (/admin). Set it in .env next to this file; empty = admin page off.
      ADMIN_PASSWORD: ${ASKIIES_ADMIN_PASSWORD:-}
    volumes:
      - askiies-mp-data:/data
    restart: unless-stopped

volumes:
  askiies-mp-data:
