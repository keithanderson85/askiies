# WebSocket upgrade helper for the multiplayer server
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Browsers must check for a newer game / add-on module on every load
    # (they still reuse their copy when nothing changed, via ETag).
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Multiplayer + cloud saves (askiies-mp container). Resolved at request time through
    # Docker's DNS so this site still starts (and plays offline) if that container is down.
    location /mp/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $mp_upstream http://askiies-mp:8080;
        rewrite ^/mp/(.*)$ /$1 break;
        proxy_pass $mp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 4m;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
